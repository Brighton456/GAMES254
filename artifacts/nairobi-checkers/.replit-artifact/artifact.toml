kind = "web"
previewPath = "/"
title = "Nairobi Checkers"
description = "A premium Kenyan skill-based checkers game with demo play, simulated M-Pesa cash flows, AI matches, rooms, tournaments, and a Nairobi-inspired player profile."
version = "1.0.0"
id = "artifacts/nairobi-checkers"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20449

[services.development]
run = "pnpm --filter @workspace/nairobi-checkers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nairobi-checkers", "run", "build" ]
serve = "static"
publicDir = "artifacts/nairobi-checkers/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20449"
BASE_PATH = "/"
